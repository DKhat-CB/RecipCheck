# RecipCheck pipeline configuration

# Metro frontiers: an institution is in-scope if its coordinates fall within
# `radius_miles` (haversine) of the center. Scope governs candidate home
# memberships and targets, NOT reciprocity reach.
metros:
  bay_area:
    label: "Bay Area"
    center: { lat: 37.7749, lng: -122.4194 }   # San Francisco
    radius_miles: 80                            # captures San Jose, Monterey (~75mi)
  nyc:
    label: "New York City"
    center: { lat: 40.7831, lng: -73.9712 }     # Manhattan
    radius_miles: 50                            # five boroughs, near NJ

# Gemini extraction
extraction:
  default_model: "gemini-2.5-flash"
  retry_model: "gemini-2.5-flash-lite"          # stronger pass on low confidence
  temperature: 0
  confidence_auto_commit: 0.8                   # >= this AND not needs_manual -> dataset
  confidence_review_floor: 0.6                  # model is told to drop below this when unsure

# Crawl politeness
crawl:
  user_agent: "RecipCheckBot/0.1 (+https://github.com/DKhat-CB/RecipCheck; contact dmitriykhat@gmail.com)"
  per_host_delay_seconds: [2, 5]                # min/max random delay per host
  max_retries: 4
  backoff_base_seconds: 2                       # exponential: 2,4,8,16
  timeout_seconds: 30

# Re-verification
maintenance:
  stale_after_days: 120                         # records older than this are flagged `stale`
